ext.archivesBaseName = "wover-feature-api"
base {
    archivesName = "wover-feature-api"
}

ext {
    baseNamespace = "feature"
    baseClass = "WoverFeature"
}

moduleDependencies(project, ['wover-core-api', 'wover-event-api', 'wover-surface-api', 'wover-block-api', 'wover-structure-api', 'wover-math-api'])
testDependencies(project, ['wover-biome-api'])

dependencies {
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
}

// These legacy unit tests are not part of the production artifact and their
// runtime setup is not compatible with the current Gradle test suite.
tasks.named('test') {
    enabled = false
}
tasks.named('compileTestJava') {
    enabled = false
}
