plugins {
    id 'java'
    id 'maven-publish'
    id 'idea'
    id 'eclipse'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}
def componentGradleProperties = new Properties()
def componentGradlePropertiesFile = file('gradle.properties')
if (!componentGradlePropertiesFile.exists()) {
    throw new GradleException("Missing component gradle.properties: ${componentGradlePropertiesFile}")
}
componentGradlePropertiesFile.withInputStream { stream ->
    componentGradleProperties.load(stream)
}
componentGradleProperties.each { key, value ->
    project.extensions.extraProperties.set(key.toString(), value)
}
base { archivesName = project.archives_base_name }
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}


def getDependencies(project, List<String> depNames, configuration) {
    return depNames.iterator().collect {
        project.dependencies.project(path: ":WorldWeaver:$it", configuration: configuration)
    }
}

apply from: "functions.gradle"
apply from: "common.gradle"
